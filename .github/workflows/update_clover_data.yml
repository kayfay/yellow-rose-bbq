name: Update Clover Data

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install polars pandas plotly statsmodels requests python-dotenv xgboost scikit-learn holidays openmeteo-requests requests-cache retry-requests pyarrow

      - name: Auto-Detect Clover Environment
        env:
          CLOVER_MERCHANT_ID: ${{ secrets.CLOVER_MERCHANT_ID }}
          CLOVER_API_KEY: ${{ secrets.CLOVER_API_KEY }}
        run: python scripts/detect_clover_env.py

      - name: Run Clover Ingestion & Analytics Pipeline
        env:
          CLOVER_MERCHANT_ID: ${{ secrets.CLOVER_MERCHANT_ID }}
          CLOVER_API_KEY: ${{ secrets.CLOVER_API_KEY }}
        run: |
          echo "Ingesting POS transactions..."
          python clover_api/ingest.py
          
          echo "Updating POS menu catalog..."
          python clover_api/ingest_itemized.py
          
          echo "Fetching external weather and holiday features..."
          python clover_api/analytics/ml_features.py
          
          echo "Running analytics engine..."
          python generate_historical_payload.py
          python clover_api/analytics/food_cost_engine.py
          python clover_api/analytics/weather_impact.py
          python clover_api/analytics/event_impact.py
          python clover_api/analytics/shift_forecast.py
          python clover_api/analytics/arima_baseline.py
          python clover_api/analytics/dashboard.py
          python clover_api/analytics/advanced_analytics.py
          python scripts/update_predictive_cache.py
          
          echo "Building javascript payloads and sync status..."
          python clover_api/analytics/build_payloads.py
          python -c "import json, datetime, os; p = json.load(open('clover_api/analytics/predictive_payload.json')) if os.path.exists('clover_api/analytics/predictive_payload.json') else {}; sk = p.get('summary_kpis', {}); cogs = sk.get('estimated_24h_cogs_usd', 0); staff = sk.get('recommended_staff', 0); hours = sk.get('pitmaster_hours', 0); fc = sk.get('estimated_food_cost_pct', 29.5); msg = f'COGS: ${cogs:,.2f} ({fc}%) | Labor: {staff} crew ({hours}h)'; status = {'last_synced_at': datetime.datetime.now().isoformat(), 'status': 'success', 'message': msg, 'next_scheduled_sync': 'Hourly via GitHub Actions'}; os.makedirs('clover_api/analytics', exist_ok=True); os.makedirs('analytics', exist_ok=True); open('clover_api/analytics/sync_status.json', 'w').write(json.dumps(status, indent=2)); open('analytics/sync_status.json', 'w').write(json.dumps(status, indent=2))"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add clover_api/analytics/*.json analytics/*.json clover_api/analytics/payloads.js WEBSITE_MENU.md
          
          # Only commit if there are changes
          if git diff-index --quiet HEAD --; then
            echo "No new data to commit."
          else
            git commit -m "chore(data): auto-update clover api analytics data (hourly)"
            git push
          fi
