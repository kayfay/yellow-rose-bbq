name: Update Clover Data

on:
  schedule:
    # Fallback only. The 30-minute trigger is the Cloudflare cron Worker in
    # sync_trigger/ (fires workflow_dispatch at :05 and :35). GitHub drops many
    # top-of-hour schedules, so this fallback runs off-peak at :07 and :37.
    - cron: '7,37 * * * *'
  workflow_dispatch: # Every 30 mins from sync_trigger Worker; also manual from the Actions tab

# Never run two syncs at once; a queued run waits and checks out the latest data.
concurrency:
  group: update-clover-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install polars pandas plotly statsmodels requests python-dotenv xgboost scikit-learn holidays openmeteo-requests requests-cache retry-requests pyarrow

      - name: Auto-Detect Clover Environment
        env:
          CLOVER_MERCHANT_ID: ${{ secrets.CLOVER_MERCHANT_ID }}
          CLOVER_API_KEY: ${{ secrets.CLOVER_API_KEY }}
        run: python scripts/detect_clover_env.py

      - name: Run Clover Ingestion & Analytics Pipeline
        env:
          CLOVER_MERCHANT_ID: ${{ secrets.CLOVER_MERCHANT_ID }}
          CLOVER_API_KEY: ${{ secrets.CLOVER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Ingesting POS transactions..."
          python clover_api/ingest.py
          
          echo "Updating POS menu catalog..."
          python clover_api/ingest_itemized.py
          
          echo "Fetching external weather and holiday features..."
          python clover_api/analytics/ml_features.py
          
          echo "Running analytics engine..."
          python generate_historical_payload.py
          python clover_api/analytics/food_cost_engine.py
          python clover_api/analytics/weather_impact.py
          python clover_api/analytics/event_impact.py
          python clover_api/analytics/shift_forecast.py
          python clover_api/analytics/arima_baseline.py
          python clover_api/analytics/dashboard.py
          python clover_api/analytics/advanced_analytics.py
          python scripts/update_predictive_cache.py
          python scripts/daily_insight_engine.py
          
          echo "Running Multimodal ML Data Intelligence Engine..."
          python scripts/ml_data_intelligence_engine.py
          
          echo "Scanning Hourly Clover Turnover for Quick-Wind Events..."
          python scripts/hourly_quick_wind_detector.py
          
          echo "Building javascript payloads and sync status..."
          python clover_api/analytics/build_payloads.py

          echo "Dispatching Automated Smokehouse Telegram Intelligence..."
          python scripts/telegram_dispatcher.py --auto || true

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add clover_api/analytics/*.json analytics/*.json api/analytics/*.json clover_api/analytics/payloads.js WEBSITE_MENU.md
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            # Discard any stray unstaged modifications to other tracked files so worktree is clean for rebase
            git checkout -- .
            git commit -m "chore(data): auto-update clover api analytics data (every 30 mins)"
            
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
                echo "Successfully rebased and pushed data update."
                break
              fi
              echo "Push failed (attempt $attempt/3), retrying in 2s..."
              sleep 2
            done
          fi

