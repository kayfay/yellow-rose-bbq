name = "yellow-rose-sync-trigger"
main = "src/index.js"
compatibility_date = "2024-10-01"
workers_dev = false

# Cloudflare cron triggers run in UTC and fire reliably, unlike GitHub's
# best-effort `schedule:` events. :05 every hour.
[triggers]
crons = ["5 * * * *"]

[vars]
GITHUB_REPO = "kayfay/yellow-rose-bbq"
WORKFLOW_FILE = "update_clover_data.yml"
GITHUB_REF = "master"

# Secret (set with `npx wrangler secret put GITHUB_TOKEN`):
# - GITHUB_TOKEN: fine-grained PAT scoped to kayfay/yellow-rose-bbq with
#   "Actions: Read and write" permission only.
